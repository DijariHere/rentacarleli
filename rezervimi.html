<style>

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* ---------- Header ---------- */

}

/* ---------- Buttons ---------- */
.btn {

  font: 700 15px/1 var(--body); letter-spacing: .02em;

/* ---------- Hero ---------- */

}

// Ilustrim anësor i makinës (përdoret kur nuk ka foto)
function ilustrimi(makina) {
  const c = makina.ngjyra;
  const suv = makina.forma === "suv";
  const small = makina.forma === "small";
  const trupi = suv
    ? "M24,128 L24,104 Q26,92 44,88 L108,78 Q138,48 172,40 L276,38 Q304,38 332,72 L366,80 Q380,84 380,100 L380,128 Z"
    : small
    ? "M40,132 L40,112 Q42,100 58,96 L118,86 Q146,58 178,50 L262,48 Q290,48 318,82 L350,90 Q362,94 362,108 L362,132 Z"
    : "M22,132 L22,112 Q24,100 40,96 L110,86 Q140,58 175,48 L270,46 Q300,46 330,80 L368,88 Q382,92 382,108 L382,132 Z";
  const xamiA = suv
    ? "M118,78 Q144,54 174,47 L218,46 L220,78 Z"
    : small
    ? "M126,86 Q150,64 180,57 L216,56 L218,86 Z"
    : "M120,86 Q146,62 176,55 L220,54 L222,86 Z";
  const xamiB = suv
    ? "M230,78 L228,46 L272,46 Q296,48 322,76 Z"
    : small
    ? "M228,86 L226,56 L260,56 Q282,58 306,84 Z"
    : "M232,86 L230,54 L268,54 Q292,56 318,84 Z";
  const r = suv ? 28 : small ? 23 : 25;
  const wy = suv ? 128 : 132;
  const w1 = suv ? 96 : small ? 102 : 95;
  const w2 = suv ? 306 : small ? 298 : 305;
  const rrota = (x) => `
    <circle cx="${x}" cy="${wy}" r="${r + 4}" fill="#101215"/>
    <circle cx="${x}" cy="${wy}" r="${r}" fill="#1C1F24"/>
    <circle cx="${x}" cy="${wy}" r="${r * 0.62}" fill="#9AA1AB"/>
    <circle cx="${x}" cy="${wy}" r="${r * 0.18}" fill="#50565F"/>`;
  const front = suv ? 28 : small ? 44 : 26;
  const back = suv ? 372 : small ? 354 : 374;
  return `<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${makina.emri}">
    <ellipse cx="200" cy="${wy + r + 2}" rx="180" ry="8" fill="#000" opacity=".12"/>
    <path d="${trupi}" fill="${c}"/>
    <path d="${trupi}" fill="url(#shk-${makina.id})"/>
    ${suv ? `<path d="M24,128 L24,116 L380,116 L380,128 Z" fill="#23262B"/>` : ""}
    <path d="${xamiA}" fill="#1E2A36" opacity=".92"/>
    <path d="${xamiB}" fill="#1E2A36" opacity=".92"/>
    <line x1="226" y1="${suv ? 80 : 88}" x2="224" y2="${suv ? 114 : 124}" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>
    <rect x="${front}" y="${suv ? 94 : 102}" width="16" height="7" rx="3" fill="#F4F1E6"/>
    <rect x="${back - 12}" y="${suv ? 86 : 94}" width="10" height="9" rx="2" fill="#B3121B"/>
    ${rrota(w1)}${rrota(w2)}
    <defs><linearGradient id="shk-${makina.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient></defs>
  </svg>`;
}

<script>
// ============================================================
//  Shtresa e të dhënave: Firebase (kur është konfiguruar) ose DEMO (localStorage)
// ============================================================

// ---------- Llogaritja e çmimit ----------
function dataNeDite(s) {
  const [y, m, d] = s.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
function sot() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shtoDite(s, n) {
  const t = new Date((dataNeDite(s) + n) * 86400000);
  return t.toISOString().slice(0, 10);
}
function numriDiteve(nga, deri) {
  if (!nga || !deri) return 0;
  const n = dataNeDite(deri) - dataNeDite(nga);
  return n < 0 ? 0 : Math.max(1, n);
}
function cmimiDitor(dite) {
  for (const c of CMIMET) if (dite >= c.ngaDite) return c.cmimi;
  return CMIMET[CMIMET.length - 1].cmimi;
}
function totali(dite) {
  return dite * cmimiDitor(dite);
}
// Intervali i zënë: [nga, deri) — nëse kthehet po atë ditë, zë 1 ditë
function interval(nga, deri) {
  const a = dataNeDite(nga);
  return [a, Math.max(dataNeDite(deri), a + 1)];
}
function mbivendosen(a1, a2, b1, b2) {
  const [x1, x2] = interval(a1, a2);
  const [y1, y2] = interval(b1, b2);
  return x1 < y2 && y1 < x2;
}
function formatoData(s) {
  if (!s) return "";
  const [y, m, d] = s.split("-");
  return `${d}.${m}.${y}`;
}

// ---------- Numrat e telefonit (Kosovë) ----------
function telNderkombetar(t) {
  let n = String(t || "").replace(/[^\d+]/g, "");
  if (n.startsWith("+")) return n.slice(1);
  if (n.startsWith("00")) return n.slice(2);
  if (n.startsWith("0")) return "383" + n.slice(1);
  return n;
}

// ============================================================
//  DEMO (localStorage) — punon vetëm në një shfletues, për provë
// ============================================================
const LS_B = "leli_demo_bookings";
const LS_K = "leli_demo_blocks";
const degjuesit = new Set();

function lexo(k) {
  try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; }
}
function shkruaj(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  degjuesit.forEach((f) => f());
}
try {
  window.addEventListener("storage", () => degjuesit.forEach((f) => f()));
} catch {}
function degjo(f) {
  degjuesit.add(f);
  f();
  return () => degjuesit.delete(f);
}
function idRastesishme() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let s = "";
  for (let i = 0; i < 20; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}

const demo = {
  async createBooking(b) {
    const id = idRastesishme();
    const all = lexo(LS_B);
    all.push({ ...b, id, status: "pending", createdAt: Date.now() });
    shkruaj(LS_B, all);
    return id;
  },
  watchBooking(id, cb) {
    return degjo(() => cb(lexo(LS_B).find((x) => x.id === id) || null));
  },
  watchBlocks(cb) {
    return degjo(() => cb(lexo(LS_K)));
  },
  watchBookings(cb) {
    return degjo(() => cb(lexo(LS_B).sort((a, b) => b.createdAt - a.createdAt)));
  },
  async setStatus(b, status) {
    const all = lexo(LS_B).map((x) => (x.id === b.id ? { ...x, status, updatedAt: Date.now() } : x));

const V = "10.12.2";
let fb = null;
async function ngarkoFirebase() {
  if (fb) return fb;
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const a = app.initializeApp(FIREBASE_CONFIG);
  fb = { fs, au, db: fs.getFirestore(a), auth: au.getAuth(a) };
  return fb;
}

const firebase = {
  async createBooking(b) {
    const { fs, db } = await ngarkoFirebase();
    const ref = await fs.addDoc(fs.collection(db, "bookings"), {
      ...b,
      status: "pending",
      createdAt: fs.serverTimestamp(),
    });
    return ref.id;
  },
  watchBooking(id, cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      unsub = fs.onSnapshot(
        fs.doc(db, "bookings", id),
        (s) => cb(s.exists() ? { id: s.id, ...s.data() } : null),
        () => cb(null)
      );
    });
    return () => unsub();
  },
  watchBlocks(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      unsub = fs.onSnapshot(fs.collection(db, "blocks"), (q) =>
        cb(q.docs.map((d) => ({ id: d.id, ...d.data() })))
      );
    });
    return () => unsub();
  },
  watchBookings(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      const q = fs.query(fs.collection(db, "bookings"), fs.orderBy("createdAt", "desc"), fs.limit(300));
      unsub = fs.onSnapshot(q, (s) =>
        cb(s.docs.map((d) => {
          const x = d.data();
          return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() || Date.now() };
        }))
      );
    });
    return () => unsub();
  },
  async setStatus(b, status) {

    const batch = fs.writeBatch(db);
    batch.update(fs.doc(db, "bookings", b.id), { status, updatedAt: fs.serverTimestamp() });
    const blockRef = fs.doc(db, "blocks", b.id);
    if (status === "approved") batch.set(blockRef, { carId: b.carId, from: b.from, to: b.to, burimi: "rezervim" });

  async login(email, pw) {

};

// ============================================================
function gabimAuth(x) {
  const c = (x && x.code) || "";
  if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Emaili ose fjalëkalimi është gabim.";
  if (c.includes("email-already-in-use")) return "Ky email ka tashmë llogari. Kliko \"Hyr\" dhe hyr me të.";
  if (c.includes("weak-password")) return "Fjalëkalimi duhet të ketë së paku 6 karaktere.";
  if (c.includes("invalid-email")) return "Emaili nuk është i saktë.";
  if (c.includes("missing-password")) return "Shkruaj fjalëkalimin.";
  if (c.includes("too-many-requests")) return "Shumë tentime. Provo përsëri pas pak minutash.";
  if (c.includes("operation-not-allowed") || c.includes("admin-restricted")) return "Kjo mënyrë hyrjeje nuk është aktivizuar ende. Na telefono në 044 296 791.";
  if (c.includes("unauthorized-domain")) return "Hyrja me Google nuk lejohet nga ky domen ende.";
  if (c.includes("network-request-failed")) return "Nuk ka internet. Kontrollo lidhjen dhe provo përsëri.";
  return (x && x.message) || "Diçka nuk shkoi. Provo përsëri.";
}

const LS_U = "leli_demo_users";
const LS_CU = "leli_demo_current";
const klientDemo = {
  _cbs: new Set(),
  _cur() { try { return JSON.parse(localStorage.getItem(LS_CU) || "null"); } catch { return null; } },
  _set(u) { try { u ? localStorage.setItem(LS_CU, JSON.stringify(u)) : localStorage.removeItem(LS_CU); } catch {} this._cbs.forEach((f) => f(u)); },
  onUser(cb) { this._cbs.add(cb); setTimeout(() => cb(this._cur()), 0); return () => this._cbs.delete(cb); },
  async signUp(name, email, pw) {
    const us = lexo(LS_U);
    if (!/^\S+@\S+\.\S+$/.test(email)) throw { code: "invalid-email" };
    if (pw.length < 6) throw { code: "weak-password" };
    if (us.some((u) => u.email === email)) throw { code: "email-already-in-use" };
    const u = { uid: "u_" + idRastesishme(), email, displayName: name };
    us.push({ ...u, pw }); try { localStorage.setItem(LS_U, JSON.stringify(us)); } catch {}
    this._set(u);
  },
  async signIn(email, pw) {
    const u = lexo(LS_U).find((x) => x.email === email && x.pw === pw);
    if (!u) throw { code: "invalid-credential" };
    this._set({ uid: u.uid, email: u.email, displayName: u.displayName });
  },
  async google() { this._set({ uid: "u_google_demo", email: "demo@gmail.com", displayName: "Klient Demo" }); },
  async reset() {},
  async logout() { this._set(null); },
  watchMine(uid, cb) { return degjo(() => cb(lexo(LS_B).filter((b) => b.uid === uid).sort((a, b) => b.createdAt - a.createdAt))); },
  async cancel(b) { shkruaj(LS_B, lexo(LS_B).map((x) => (x.id === b.id ? { ...x, status: "cancelled", updatedAt: Date.now() } : x))); },
};

const klientFirebase = {
  onUser(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ au, auth }) => {
      au.getRedirectResult(auth).catch(() => {});
      unsub = au.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL } : null));
    });
    return () => unsub();
  },
  async signUp(name, email, pw) {
    const { au, auth } = await ngarkoFirebase();
    const r = await au.createUserWithEmailAndPassword(auth, email, pw);
    await au.updateProfile(r.user, { displayName: name });
    await r.user.reload();
    klientFirebase._refresh && klientFirebase._refresh();
  },
  async signIn(email, pw) {
    const { au, auth } = await ngarkoFirebase();
    await au.signInWithEmailAndPassword(auth, email, pw);
  },
  async google() {
    const { au, auth } = await ngarkoFirebase();
    const p = new au.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    try { await au.signInWithPopup(auth, p); }
    catch (x) {
      const c = (x && x.code) || "";
      if (c.includes("popup-blocked") || c.includes("operation-not-supported")) return au.signInWithRedirect(auth, p);
      throw x;
    }
  },
  async reset(email) {
    const { au, auth } = await ngarkoFirebase();
    await au.sendPasswordResetEmail(auth, email);
  },
  async logout() {
    const { au, auth } = await ngarkoFirebase();
    await au.signOut(auth);
  },
  watchMine(uid, cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      const q = fs.query(fs.collection(db, "bookings"), fs.where("uid", "==", uid));
      unsub = fs.onSnapshot(q, (s) => cb(s.docs.map((d) => {
        const x = d.data();
        return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() || Date.now() };
      }).sort((a, b) => b.createdAt - a.createdAt)), () => cb([]));
    });
    return () => unsub();
  },
  async cancel(b) {
    const { fs, db } = await ngarkoFirebase();
    await fs.updateDoc(fs.doc(db, "bookings", b.id), { status: "cancelled", updatedAt: fs.serverTimestamp() });
  },
};

// ============================================================
//  Hyrja / regjistrimi i klientëve dhe butoni i llogarisë lart
// ============================================================
const AuthUI = (() => {
  const q = (s) => document.querySelector(s);
  const e = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let user; // undefined = duke u ngarkuar, null = jo i kyçur
  let pas = null;
  let mode = "login";
  let numri = 0;
  const subs = new Set();

  const G = `<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>`;

  document.body.insertAdjacentHTML("beforeend", `
  <dialog id="auth-dlg" class="auth-dlg" aria-labelledby="auth-title">
    <div class="auth-head">
      <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#F5B700"/><path d="M22 10V44H54" fill="none" stroke="#15181C" stroke-width="14" stroke-linejoin="round"/><path d="M22 12V44H52" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div><h3 id="auth-title">Hyr në llogari</h3><small id="auth-sub">Për të rezervuar dhe për të parë statusin e rezervimeve</small></div>
      <button class="x" type="button" id="auth-x" aria-label="Mbyll">×</button>
    </div>
    <div class="auth-body">
      <div class="auth-tabs" role="tablist">
        <button type="button" role="tab" data-mode="login" aria-selected="true">Hyr</button>
        <button type="button" role="tab" data-mode="signup" aria-selected="false">Regjistrohu</button>
      </div>
      <button type="button" class="gbtn" id="auth-google">${G}<span>Vazhdo me Google</span></button>
      <div class="or"><span>ose me email</span></div>
      <form id="auth-form" novalidate>
        <label class="f" id="auth-name-row" hidden>Emri dhe mbiemri<input type="text" id="auth-name" autocomplete="name" maxlength="80"></label>
        <label class="f">Emaili<input type="email" id="auth-email" autocomplete="email" required></label>
        <label class="f">Fjalëkalimi<input type="password" id="auth-pw" autocomplete="current-password" required minlength="6"></label>
        <button type="button" class="lnk-btn" id="auth-forgot">Harrove fjalëkalimin?</button>
        <div class="err" id="auth-err" hidden></div>
        <div class="okmsg" id="auth-ok" hidden></div>
        <button class="btn btn-y btn-full" type="submit" id="auth-submit">Hyr</button>
      </form>
      <p class="note" style="text-align:center">Rezervimet e tua ruhen në llogari dhe i sheh vetëm ti.</p>
    </div>
  </dialog>`);

  const dlg = q("#auth-dlg");
  const err = q("#auth-err"), ok = q("#auth-ok");

  function setMode(m) {
    mode = m;
    const sign = m === "signup";
    q("#auth-title").textContent = sign ? "Krijo llogari" : "Hyr në llogari";
    q("#auth-name-row").hidden = !sign;
    q("#auth-forgot").hidden = sign;
    q("#auth-pw").autocomplete = sign ? "new-password" : "current-password";
    q("#auth-submit").textContent = sign ? "Krijo llogarinë" : "Hyr";
    dlg.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    err.hidden = true; ok.hidden = true;
  }
  function open(m = "login", after = null) {
    if (after) pas = after;
    setMode(m);
    if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
  }
  function close() { if (dlg.open) dlg.close(); }
  function showErr(x) {
    const t = typeof x === "string" ? x : gabimAuth(x);
    if (!t) return;
    ok.hidden = true; err.hidden = false; err.textContent = t;
  }
  function busy(b) {
    q("#auth-submit").disabled = b; q("#auth-google").disabled = b;
  }

  dlg.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  q("#auth-x").addEventListener("click", () => { pas = null; close(); });
  dlg.addEventListener("click", (ev) => { if (ev.target === dlg) { pas = null; close(); } });

  q("#auth-google").addEventListener("click", async () => {
    err.hidden = true; busy(true);
    try { await api.klient.google(); } catch (x) { showErr(x); } finally { busy(false); }
  });

  q("#auth-forgot").addEventListener("click", async () => {
    const em = q("#auth-email").value.trim();
    if (!em) return showErr("Shkruaj emailin lart, pastaj kliko përsëri \"Harrove fjalëkalimin?\".");
    try {
      await api.klient.reset(em);
      err.hidden = true; ok.hidden = false;
      ok.textContent = `Të dërguam një email në ${em} për të vendosur fjalëkalim të ri. Kontrollo edhe Spam.`;
    } catch (x) { showErr(x); }
  });

  q("#auth-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = q("#auth-name").value.trim();
    const em = q("#auth-email").value.trim();
    const pw = q("#auth-pw").value;
    if (mode === "signup" && name.length < 3) return showErr("Shkruaj emrin dhe mbiemrin.");
    if (!em) return showErr("Shkruaj emailin.");
    if (pw.length < 6) return showErr("Fjalëkalimi duhet të ketë së paku 6 karaktere.");
    err.hidden = true; busy(true);
    try {
      if (mode === "signup") {
        await api.klient.signUp(name, em, pw);
        if (user && !user.displayName) { user = { ...user, displayName: name }; njofto(); }
      } else await api.klient.signIn(em, pw);
      q("#auth-pw").value = "";
    } catch (x) { showErr(x); } finally { busy(false); }
  });

  function emriShkurt(u) {
    const n = (u.displayName || u.email || "").trim();
    return n.split(/[\s@]/)[0] || "Llogaria";
  }

  function renderAcct() {
    const el = q("#acct");
    if (!el) return;
    if (user === undefined) { el.innerHTML = ""; return; }
    if (!user) {
      el.innerHTML = `<button class="btn btn-line btn-sm acct-in" type="button" data-auth-open="login">Hyr</button>`;
      return;
    }
    const ini = emriShkurt(user).charAt(0).toUpperCase();
    el.innerHTML = `
      <a class="acct-chip" href="rezervimi.html" title="Rezervimet e mia">
        <span class="avatar">${e(ini)}</span>
        <span class="acct-txt"><small>Rezervimet e mia</small><b>${e(emriShkurt(user))}</b></span>
        ${numri ? `<span class="acct-badge num">${numri}</span>` : ""}
      </a>`;
  }

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-auth-open]");
    if (b) { ev.preventDefault(); open(b.dataset.authOpen); }
    const o = ev.target.closest("[data-logout]");
    if (o) { ev.preventDefault(); api.klient.logout(); }
  });

  function njofto() {
    renderAcct();
    subs.forEach((f) => f(user));
  }

  api.klient.onUser((u) => {
    user = u;
    njofto();
    if (u && dlg.open) {
      close();
      const f = pas; pas = null;
      if (f) f(u);
    }
  });

  return {
    onUser(f) { subs.add(f); if (user !== undefined) f(user); },
    user: () => user,
    require(f) { if (user) f(user); else open("login", f); },
    open,
    setCount(n) { numri = n; renderAcct(); },
  };
})();

    el.innerHTML = `
      <div class="me-head">
        <div><p class="eyebrow">Llogaria</p><h1>Rezervimet e mia</h1><p>${esc(user.displayName || "")}${user.displayName ? " · " : ""}${esc(user.email || "")}</p></div>
        <button class="btn btn-line btn-sm" data-logout>Dil nga llogaria</button>
      </div>
      ${lista.length ? "" : `
        <div class="empty">
          <h3 style="font-size:28px;text-transform:uppercase">Nuk ke ende rezervime</h3>
          <p style="margin:0;color:var(--muted)">Zgjidh një makinë dhe rezervoje për disa sekonda.</p>
          <a class="btn btn-y" href="index.html#makinat">Shiko makinat</a>
        </div>`}
      ${aktive.length ? `<section class="me-sec"><h2>Aktive</h2><div class="me-list">${aktive.map(karta).join("")}</div></section>` : ""}
      ${tjera.length ? `<section class="me-sec"><h2>Historia</h2><div class="me-list">${tjera.map(karta).join("")}</div></section>` : ""}`;
    AuthUI.setCount(aktive.length);
  }

  document.addEventListener("click", async (ev) => {
    const a = ev.target.closest("[data-anulo]");
    if (a) { perAnulim = a.dataset.anulo; return render(); }
    if (ev.target.closest("[data-anulo-jo]")) { perAnulim = null; return render(); }
    const po = ev.target.closest("[data-anulo-po]");
    if (po) {
      const b = lista.find((x) => x.id === po.dataset.anuloPo);
      po.disabled = true;
      try { await api.klient.cancel(b); perAnulim = null; }
      catch { alert("Anulimi nuk u krye. Na telefono në 044 296 791."); }
      render();
    }
  });

  AuthUI.onUser((u) => {
    user = u;
    unsub(); unsub = () => {};
    lista = [];
    if (u) unsub = api.klient.watchMine(u.uid, (l) => { lista = l || []; render(); });
    render();
  });
  render();
})();
</script>
</body>
</html>

<style>
:root {
  --ink: #15181c;
  --ink-2: #23272d;
  --paper: #f3f4f1;
  --card: #ffffff;
  --line: #d9dcd5;
  --muted: #5b636e;
  --text: #1a1d21;
  --yellow: #f5b700;
  --yellow-soft: #fff4cc;
  --ok: #1d7a4c;
  --ok-soft: #e3f3ea;
  --warn: #a4640b;
  --warn-soft: #fdf0d9;
  --bad: #b42318;
  --bad-soft: #fbe6e4;
  --radius: 10px;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font: 400 16px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.wrap { width: 100%; max-width: 1140px; margin: 0 auto; padding-inline: 20px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 13px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink); color: #fff;
  border-bottom: 1px solid #000;
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand-txt { display: grid; line-height: 1; }
.brand-txt small { font: 600 11px/1 var(--body); letter-spacing: .22em; color: #c9ccd1; }
.brand-txt b { font: 800 26px/1 var(--display); letter-spacing: .02em; }
.brand-txt b span { color: var(--yellow); }
.nav { display: flex; align-items: center; gap: 22px; font-weight: 500; }
.nav a { text-decoration: none; color: #d8dbe0; }
.nav a:hover { color: #fff; }
.nav .tel { display: none; }
@media (max-width: 760px) { .nav a:not(.btn) { display: none; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 700 15px/1 var(--body); letter-spacing: .02em;
  padding: 13px 20px; border-radius: 8px; border: 2px solid transparent;
  cursor: pointer; text-decoration: none; transition: transform .12s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn-y { background: var(--yellow); color: #1b1400; }
.btn-y:hover { background: #ffc61a; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: var(--ink-2); }
.btn-line { background: transparent; border-color: currentColor; }
.btn-sm { padding: 9px 14px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-bad { background: #fff; color: var(--bad); border-color: #e7b7b2; }

/* ---------- Hero ---------- */
.hero { background: var(--ink); color: #fff; position: relative; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1.25fr .9fr; gap: 48px; padding-block: 64px 88px; align-items: center; }
.hero h1 { font-size: clamp(44px, 7vw, 84px); font-weight: 800; text-transform: uppercase; }
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero p { color: #c8ccd2; font-size: 18px; max-width: 34em; margin: 20px 0 28px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-cta .btn-line { color: #fff; }
.road {
  position: absolute; left: 0; right: 0; bottom: 26px; height: 6px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 56px, transparent 56px 96px);
  opacity: .9;
}
@media (prefers-reduced-motion: no-preference) {
  .road { animation: road 2.4s linear infinite; }
  @keyframes road { to { background-position: -96px 0; } }
}

/* Price placard */
.placard {
  background: var(--yellow); color: #1b1400; border-radius: 14px;
  padding: 26px 26px 20px; border: 4px solid #1b1400;
  box-shadow: 0 0 0 4px var(--yellow), 0 24px 50px rgba(0,0,0,.35);
}
.placard h2 { font-size: 22px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
.tier { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 2px solid rgba(27,20,0,.2); }
.tier span { font-weight: 600; font-size: 17px; }
.tier b { font: 800 44px/1 var(--display); }
.tier b small { font: 600 15px var(--body); margin-left: 2px; }
.placard p { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: #3d3100; }

/* ---------- Sections ---------- */
section { padding-block: 72px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; margin-bottom: 32px; }
.head h2 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; text-transform: uppercase; margin-top: 8px; }
.head p { color: var(--muted); max-width: 30em; margin: 0; }

/* ---------- Car cards ---------- */
.cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
@media (max-width: 980px) { .cars { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cars { grid-template-columns: 1fr; } .hero .wrap { grid-template-columns: 1fr; } }
@media (max-width: 900px) and (min-width: 641px) { .hero .wrap { grid-template-columns: 1fr; } .placard { max-width: 460px; } }
.car { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.car-img { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(180deg, #eceee9, #dfe2dc); display: grid; place-items: center; }
.car-img img { width: 100%; height: 100%; object-fit: cover; }
.car-img svg { width: 88%; }
.car-year { position: absolute; top: 12px; left: 12px; background: var(--ink); color: #fff; font: 700 13px/1 var(--body); padding: 7px 10px; border-radius: 6px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 700 13px/1 var(--body); padding: 7px 11px; border-radius: 999px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.car-img .pill { position: absolute; top: 12px; right: 12px; }
.car-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.car-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.car-title h3 { font-size: 30px; font-weight: 700; text-transform: uppercase; }
.car-title span { color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.car-body p { margin: 0; color: #3c434c; font-size: 15px; }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0; }
.specs div { background: #fafbf8; padding: 9px 10px; }
.specs dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 2px 0 0; font-weight: 600; font-size: 14px; }
.busy { font-size: 13px; color: var(--muted); margin: 0; }
.busy b { color: var(--bad); font-weight: 600; }
.car-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.from { line-height: 1.1; }
.from small { display: block; font-size: 12px; color: var(--muted); }
.from b { font: 800 32px/1 var(--display); }

/* ---------- Steps ---------- */
.steps-sec { background: #e8eae4; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; padding-top: 18px; border-top: 3px solid var(--ink); }
.steps li::before { content: counter(s); font: 800 44px/1 var(--display); color: var(--yellow); -webkit-text-stroke: 1.5px var(--ink); }
.steps h3 { font-size: 24px; text-transform: uppercase; margin: 10px 0 6px; }
.steps p { margin: 0; color: #3c434c; }

/* ---------- Contact ---------- */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 760px) { .contact { grid-template-columns: 1fr; } }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
.box h3 { font-size: 26px; text-transform: uppercase; margin-bottom: 10px; }
.phone { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.phone b { font: 700 30px/1 var(--display); letter-spacing: .02em; }
.phone small { display: block; color: var(--muted); font-size: 13px; }
.phone .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.map-box { background: var(--ink); color: #fff; border: 0; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.map-box p { color: #c8ccd2; margin: 0; }
.map-grid { position: absolute; inset: 0; opacity: .12; background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }
.pin { width: 54px; height: 54px; }
.map-box > * { position: relative; }
.map-box .btn { align-self: flex-start; margin-top: auto; }

footer { background: var(--ink); color: #9ea4ad; padding-block: 28px; font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
footer a { color: #9ea4ad; }

/* ---------- Dialog / forms ---------- */
dialog { border: 0; padding: 0; border-radius: 16px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--card); color: var(--text); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,12,15,.6); }
.dlg-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: var(--ink); color: #fff; }
.dlg-head .mini { width: 92px; flex: none; background: #2a2f36; border-radius: 8px; padding: 4px; }
.dlg-head h3 { font-size: 26px; text-transform: uppercase; }
.dlg-head small { color: #b9bec6; }
.x { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 28px; line-height: 1; cursor: pointer; padding: 4px 8px; }
.dlg-body { padding: 20px; display: grid; gap: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.f input, .f select, .f textarea {
  font: 400 16px var(--body); padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); width: 100%;
}
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--yellow-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); }
.sum { background: var(--yellow-soft); border: 1.5px solid #f0d77a; border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.sum .l { display: flex; justify-content: space-between; font-size: 15px; }
.sum .t { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px dashed #d9bd55; padding-top: 8px; margin-top: 4px; }
.sum .t b { font: 800 34px/1 var(--display); }
.err { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 500; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.done { text-align: center; padding: 30px 22px; display: grid; gap: 12px; justify-items: center; }
.done .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; font: 800 34px var(--display); }
.code { font: 700 15px ui-monospace, Menlo, Consolas, monospace; background: #f1f2ef; padding: 8px 12px; border-radius: 6px; word-break: break-all; }

.demo-bar { background: var(--yellow); color: #1b1400; font-size: 14px; font-weight: 600; text-align: center; padding: 8px 16px; }

/* ---------- Kalkulatori i çmimit në kartelë ---------- */
.calc { margin-top: auto; background: #f6f7f3; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.calc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.calc-lbl { font-weight: 700; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: #fff; }
.stepper button { width: 38px; height: 38px; border: 0; background: #fff; font: 700 20px/1 var(--body); cursor: pointer; color: var(--text); }
.stepper button:hover:not([disabled]) { background: var(--yellow-soft); }
.stepper button[disabled] { color: #c3c7cc; cursor: not-allowed; }
.stepper output { min-width: 70px; text-align: center; font-weight: 700; border-inline: 1.5px solid var(--line); line-height: 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; font: 600 13px var(--body); cursor: pointer; color: var(--text); }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.calc-total { display: flex; justify-content: space-between; align-items: end; gap: 10px; border-top: 1.5px dashed var(--line); padding-top: 10px; }
.calc-total span { color: var(--muted); font-size: 14px; font-weight: 600; display: block; }
.calc-total em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 3px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
.calc-total b { font: 800 40px/1 var(--display); }
.btn-full { width: 100%; }
.dlg-head .mini img { border-radius: 6px; aspect-ratio: 16/10; object-fit: cover; width: 100%; }

</style>
<style>
  .st-wrap { max-width: 620px; margin: 0 auto; padding-block: 48px 72px; display: grid; gap: 20px; }
  .st-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .st-top { padding: 22px; display: grid; gap: 8px; }

  .find { display: flex; gap: 10px; flex-wrap: wrap; }
  .find input { flex: 1 1 220px; font: 400 16px var(--body); padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; }
</style>
</head>

      "Crossover me pozicion të lartë ulje dhe pamje të mirë të rrugës. Hapësirë e bollshme për bagazhe dhe e sigurt edhe në rrugë malore.",
    specifikat: {

      "Karburanti": "Naftë",
      "Transmisioni": "Automatik",
      "Bagazhi": "377 L",
      "Klima": "Po",
    },
  },
];

function gjejMakinen(id) {
  return MAKINAT.find((m) => m.id === id);
}

// Ilustrim anësor i makinës (përdoret kur nuk ka foto)
function ilustrimi(makina) {
  const c = makina.ngjyra;
  const suv = makina.forma === "suv";
  const small = makina.forma === "small";
  const trupi = suv
    ? "M24,128 L24,104 Q26,92 44,88 L108,78 Q138,48 172,40 L276,38 Q304,38 332,72 L366,80 Q380,84 380,100 L380,128 Z"

    : small

  const w1 = suv ? 96 : small ? 102 : 95;

  const rrota = (x) => `

    <circle cx="${x}" cy="${wy}" r="${r * 0.18}" fill="#50565F"/>`;
  const front = suv ? 28 : small ? 44 : 26;
  const back = suv ? 372 : small ? 354 : 374;
  return `<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${makina.emri}">
    <ellipse cx="200" cy="${wy + r + 2}" rx="180" ry="8" fill="#000" opacity=".12"/>

    ${suv ? `<path d="M24,128 L24,116 L380,116 L380,128 Z" fill="#23262B"/>` : ""}
    <path d="${xamiA}" fill="#1E2A36" opacity=".92"/>

    <line x1="226" y1="${suv ? 80 : 88}" x2="224" y2="${suv ? 114 : 124}" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>
    <rect x="${front}" y="${suv ? 94 : 102}" width="16" height="7" rx="3" fill="#F4F1E6"/>

    <defs><linearGradient id="shk-${makina.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>

}

<script>
// ============================================================
//  Shtresa e të dhënave: Firebase (kur është konfiguruar) ose DEMO (localStorage)
// ============================================================

// ---------- Llogaritja e çmimit ----------
function dataNeDite(s) {
  const [y, m, d] = s.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
function sot() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shtoDite(s, n) {
  const t = new Date((dataNeDite(s) + n) * 86400000);
  return t.toISOString().slice(0, 10);
}
function numriDiteve(nga, deri) {
  if (!nga || !deri) return 0;
  const n = dataNeDite(deri) - dataNeDite(nga);
  return n < 0 ? 0 : Math.max(1, n);
}
function cmimiDitor(dite) {
  for (const c of CMIMET) if (dite >= c.ngaDite) return c.cmimi;
  return CMIMET[CMIMET.length - 1].cmimi;
}
function totali(dite) {
  return dite * cmimiDitor(dite);
}
// Intervali i zënë: [nga, deri) — nëse kthehet po atë ditë, zë 1 ditë
function interval(nga, deri) {
  const a = dataNeDite(nga);
  return [a, Math.max(dataNeDite(deri), a + 1)];
}
function mbivendosen(a1, a2, b1, b2) {
  const [x1, x2] = interval(a1, a2);
  const [y1, y2] = interval(b1, b2);
  return x1 < y2 && y1 < x2;
}
function formatoData(s) {
  if (!s) return "";
  const [y, m, d] = s.split("-");
  return `${d}.${m}.${y}`;
}

// ---------- Numrat e telefonit (Kosovë) ----------
function telNderkombetar(t) {
  let n = String(t || "").replace(/[^\d+]/g, "");
  if (n.startsWith("+")) return n.slice(1);
  if (n.startsWith("00")) return n.slice(2);
  if (n.startsWith("0")) return "383" + n.slice(1);
  return n;
}

// ============================================================
//  DEMO (localStorage) — punon vetëm në një shfletues, për provë
// ============================================================
const LS_B = "leli_demo_bookings";
const LS_K = "leli_demo_blocks";
const degjuesit = new Set();

function lexo(k) {
  try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; }
}
function shkruaj(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  degjuesit.forEach((f) => f());
}
try {
  window.addEventListener("storage", () => degjuesit.forEach((f) => f()));
} catch {}
function degjo(f) {
  degjuesit.add(f);
  f();
  return () => degjuesit.delete(f);
}
function idRastesishme() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let s = "";
  for (let i = 0; i < 20; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}

const demo = {
  async createBooking(b) {
    const id = idRastesishme();
    const all = lexo(LS_B);
    all.push({ ...b, id, status: "pending", createdAt: Date.now() });
    shkruaj(LS_B, all);
    return id;
  },
  watchBooking(id, cb) {
    return degjo(() => cb(lexo(LS_B).find((x) => x.id === id) || null));
  },
  watchBlocks(cb) {
    return degjo(() => cb(lexo(LS_K)));
  },
  watchBookings(cb) {
    return degjo(() => cb(lexo(LS_B).sort((a, b) => b.createdAt - a.createdAt)));
  },
  async setStatus(b, status) {
    const all = lexo(LS_B).map((x) => (x.id === b.id ? { ...x, status, updatedAt: Date.now() } : x));
    shkruaj(LS_B, all);
    let bl = lexo(LS_K).filter((k) => k.id !== b.id);
    if (status === "approved") bl.push({ id: b.id, carId: b.carId, from: b.from, to: b.to, burimi: "rezervim" });
    shkruaj(LS_K, bl);
  },
  async addManualBlock(carId, from, to, shenim) {
    const bl = lexo(LS_K);
    bl.push({ id: "m_" + idRastesishme(), carId, from, to, shenim: shenim || "", burimi: "manual" });
    shkruaj(LS_K, bl);
  },
  async removeBlock(id) {
    shkruaj(LS_K, lexo(LS_K).filter((k) => k.id !== id));
  },
  onAuth(cb) {
    let u = null;
    try { u = sessionStorage.getItem("leli_demo_admin") ? { email: "demo" } : null; } catch {}
    cb(u);
    this._authCb = cb;
    return () => {};
  },
  async login(email, pw) {
    if (pw !== "demo") throw new Error("Në modalitetin demo fjalëkalimi është: demo");
    try { sessionStorage.setItem("leli_demo_admin", "1"); } catch {}
    this._authCb && this._authCb({ email: "demo" });
  },
  async logout() {
    try { sessionStorage.removeItem("leli_demo_admin"); } catch {}
    this._authCb && this._authCb(null);
  },
};

// ============================================================
//  FIREBASE
// ============================================================
const V = "10.12.2";
let fb = null;
async function ngarkoFirebase() {
  if (fb) return fb;
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const a = app.initializeApp(FIREBASE_CONFIG);
  fb = { fs, au, db: fs.getFirestore(a), auth: au.getAuth(a) };
  return fb;
}

const firebase = {
  async createBooking(b) {
    const { fs, db } = await ngarkoFirebase();
    const ref = await fs.addDoc(fs.collection(db, "bookings"), {
      ...b,
      status: "pending",
      createdAt: fs.serverTimestamp(),
    });
    return ref.id;
  },
  watchBooking(id, cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      unsub = fs.onSnapshot(
        fs.doc(db, "bookings", id),
        (s) => cb(s.exists() ? { id: s.id, ...s.data() } : null),
        () => cb(null)
      );
    });
    return () => unsub();
  },
  watchBlocks(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      unsub = fs.onSnapshot(fs.collection(db, "blocks"), (q) =>
        cb(q.docs.map((d) => ({ id: d.id, ...d.data() })))
      );
    });
    return () => unsub();
  },
  watchBookings(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ fs, db }) => {
      const q = fs.query(fs.collection(db, "bookings"), fs.orderBy("createdAt", "desc"), fs.limit(300));
      unsub = fs.onSnapshot(q, (s) =>
        cb(s.docs.map((d) => {
          const x = d.data();
          return { id: d.id, ...x, createdAt: x.createdAt?.toMillis?.() || Date.now() };
        }))
      );
    });
    return () => unsub();
  },
  async setStatus(b, status) {
    const { fs, db } = await ngarkoFirebase();
    const batch = fs.writeBatch(db);
    batch.update(fs.doc(db, "bookings", b.id), { status, updatedAt: fs.serverTimestamp() });
    const blockRef = fs.doc(db, "blocks", b.id);
    if (status === "approved") batch.set(blockRef, { carId: b.carId, from: b.from, to: b.to, burimi: "rezervim" });
    else batch.delete(blockRef);
    await batch.commit();
  },
  async addManualBlock(carId, from, to, shenim) {
    const { fs, db } = await ngarkoFirebase();
    await fs.addDoc(fs.collection(db, "blocks"), { carId, from, to, shenim: shenim || "", burimi: "manual" });
  },
  async removeBlock(id) {
    const { fs, db } = await ngarkoFirebase();
    await fs.deleteDoc(fs.doc(db, "blocks", id));
  },
  onAuth(cb) {
    let unsub = () => {};
    ngarkoFirebase().then(({ au, auth }) => { unsub = au.onAuthStateChanged(auth, cb); });
    return () => unsub();
  },
  async login(email, pw) {
    const { au, auth } = await ngarkoFirebase();
    await au.signInWithEmailAndPassword(auth, email, pw);
  },
  async logout() {
    const { au, auth } = await ngarkoFirebase();
    await au.signOut(auth);
  },
};

const api = DEMO ? demo : firebase;

</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TXT = {
  pending:   ["Në pritje", "Rezervimi u pranua dhe po pret aprovimin. Do të të kthejmë mesazh sapo ta konfirmojmë."],
  approved:  ["Aprovuar", "Makina është gati për ta marrë te Autolarje Leli në datën dhe orën e caktuar. Sill letërnjoftimin dhe patentën."],
  rejected:  ["Refuzuar", "Na vjen keq, makina nuk është në dispozicion për këto data. Na telefono për një datë tjetër."],
  cancelled: ["Anuluar", "Ky rezervim është anuluar."],
  completed: ["Përfunduar", "Faleminderit që zgjodhët Rent A Car Leli!"],
};
let unsub = () => {};
function shfaq(id) {
  unsub();
  $("#kodi").value = id;
  $("#out").innerHTML = `<p class="note">Duke kërkuar…</p>`;
  unsub = api.watchBooking(id, (b) => {
    if (!b) { $("#out").innerHTML = `<div class="err">Nuk u gjet asnjë rezervim me këtë kod. Kontrollo kodin ose na telefono.</div>`; return; }
    const [t, p] = TXT[b.status] || TXT.pending;
    $("#out").innerHTML = `
      <div class="st-card">
        <div class="st-top ${esc(b.status)}">
          <span class="pill ${b.status === "approved" ? "ok" : b.status === "pending" ? "warn" : "bad"}" style="justify-self:start">${t}</span>
          <h1>${esc(b.carName)}</h1>
          <p style="margin:0">${p}</p>
        </div>
        <dl class="st-list">
          <div><dt>Emri</dt><dd>${esc(b.emri)}</dd></div>
          <div><dt>Marrja</dt><dd class="num">${formatoData(b.from)} · ${esc(b.ora)}</dd></div>
          <div><dt>Kthimi</dt><dd class="num">${formatoData(b.to)}</dd></div>
          <div><dt>Ditë</dt><dd class="num">${b.dite} × ${b.cmimi}€</dd></div>
          <div><dt>Totali</dt><dd class="num" style="font:800 26px var(--display)">${b.totali}€</dd></div>
        </dl>
      </div>`;
  });
}
$("#find").addEventListener("submit", (e) => { e.preventDefault(); const v = $("#kodi").value.trim(); if (v) { history.replaceState(null, "", "?id=" + encodeURIComponent(v)); shfaq(v); } });
const id = new URLSearchParams(location.search).get("id");
let fundit = null;
try { fundit = JSON.parse(localStorage.getItem("leli_rezervimet") || "[]")[0]; } catch {}
if (id) shfaq(id); else if (fundit) shfaq(fundit);
</script>
